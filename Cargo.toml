[package]
name = "ownchain"
version = "0.1.0"
edition = "2021"
description = "OwnChain — canonical encoding, hashing and Merkle commitments for protocol v1"
publish = false

[lib]
name = "ownchain"
path = "src/lib.rs"

[[bin]]
name = "ownchain"
path = "src/main.rs"

# Protocol dependencies are added deliberately, one milestone at a time.
#
# M1-A (canonical encoding / hashing / Merkle roots):
#   blake2 = RustCrypto pure-Rust BLAKE2b implementation, used for all
#   BLAKE2b-256 protocol hashing (chain IDs, transaction IDs, block IDs,
#   Merkle leaves and inner nodes).
[dependencies]
blake2 = { version = "0.11.0", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc"] }
nonempty = "0.11"
orchard = "0.16.0"

# M1-I (Node runtime, embedded persistence, and P2P networking):
redb = "2.1"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
async-trait = "0.1"
libp2p = { version = "0.54", default-features = false, features = ["tcp", "tokio", "noise", "yamux", "gossipsub", "kad", "identify", "ping", "request-response", "macros"] }
tempfile = "3.10"

# M1-C2 build dependency: compiles the vendored RandomX v1.2.3 native library
# from source via cmake. Requires cmake and a C++ compiler on the build host.
[build-dependencies]
cmake = "0.1"

# Test-only dependency used to express golden vectors as hex text.
[dev-dependencies]
hex = "0.4.3"
incrementalmerkletree = "0.9.0"
rand = "0.10.3"
