[package]
name = "ownchain"
version = "0.1.0"
edition = "2021"
description = "OwnChain — canonical encoding, hashing and Merkle commitments for protocol v1"
publish = false

[lib]
name = "ownchain"
path = "src/lib.rs"

[[bin]]
name = "ownchain"
path = "src/main.rs"

# Protocol dependencies are added deliberately, one milestone at a time.
#
# M1-A (canonical encoding / hashing / Merkle roots):
#   blake2 = RustCrypto pure-Rust BLAKE2b implementation, used for all
#   BLAKE2b-256 protocol hashing (chain IDs, transaction IDs, block IDs,
#   Merkle leaves and inner nodes).
[dependencies]
blake2 = { version = "0.11.0", default-features = false }
orchard = "0.16.0"

# Test-only dependency used to express golden vectors as hex text.
[dev-dependencies]
hex = "0.4.3"
